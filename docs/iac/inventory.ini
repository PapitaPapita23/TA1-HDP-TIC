; ===========================================================================
; Inventario de Ansible - NovaTech Portal de Pedidos (PROPUESTA)
; Lista de servidores sobre los que se ejecuta playbook.yml.
; La IP sale del output "ip_publica" de Terraform (main.tf).
; ===========================================================================

[portal_pedidos]
; staging.novatech.local  ansible_host=<IP_DE_TERRAFORM>
servidor-staging ansible_host=203.0.113.25

[portal_pedidos:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/novatech-key.pem
ansible_python_interpreter=/usr/bin/python3
; Evita el prompt de host desconocido en ejecuciones automatizadas del pipeline
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
